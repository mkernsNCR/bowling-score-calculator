<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="/bowling-calc.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Bowling Score Tutor - Learn Bowling Scoring</title>
    <meta name="description" content="Interactive bowling score tracker that teaches you how bowling scoring works in real-time. Learn strikes, spares, and bonus calculations frame-by-frame.">
    <style>
      #loading-spinner {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      
      .bowling-ball-spinner {
        width: 80px;
        height: 80px;
        background-image: url('/bowling-ball-sprite.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        animation: spin 2s linear infinite, bounce 1s ease-in-out infinite;
        border-radius: 50%;
        margin-bottom: 20px;
      }
      
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes bounce {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(180deg); }
      }
      
      .loading-text {
        color: #f8fafc;
        font-family: 'Inter', sans-serif;
        font-size: 18px;
        font-weight: 500;
        text-align: center;
        margin-top: 10px;
      }
      
      .loading-text::after {
        content: '';
        animation: dots 1.5s ease-in-out infinite;
      }
      
      @keyframes dots {
        0%, 20% { content: ''; }
        40% { content: '.'; }
        60% { content: '..'; }
        80%, 100% { content: '...'; }
      }
      
      #loading-spinner.fade-out {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="loading-spinner">
      <div class="bowling-ball-spinner"></div>
      <div class="loading-text">Loading Bowling Score Tutor</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
